  - title: Colour Hierarchy
    content: |
      Coral value by colour:
    subsections:
      - title: Ox Blood Red
        content: |
          The most valuable coral colour:

          - Deep, saturated red
          - Even colour distribution
          - Minimal white core
          - Japanese (Corallium japonicum) origin
          - Commands highest prices

      - title: Angel Skin Pink
        content: |
          Delicate pale pink:

          - Subtle, feminine colour
          - Even, translucent quality
          - Popular in Victorian era
          - Japanese origin prized
          - Second highest value

      - title: Other Colours
        content: |
          - **Salmon/orange**: Common Mediterranean
          - **White**: Used in jewellery; lower value
          - **Mottled**: Uneven colour; lower value

  - title: Coral Identification
    content: |
      Distinguishing genuine from imitation coral:
    subsections:
      - title: Natural Features
        content: |
          - **Grain pattern**: Wood-like growth lines
          - **Colour variation**: Subtle natural variation
          - **White core**: May show in cross-section
          - **Weight**: Heavier than most plastic

      - title: Tests
        table:
          headers:
            - Test
            - Coral
            - Imitation
          rows:
            - ["Acid test (HCl)", "Effervesces", "No reaction (usually)"]
            - ["Hot needle", "Calcite smell", "Plastic/acrid smell"]
            - ["Magnification", "Growth structure", "Mold marks, bubbles"]
            - ["Weight", "Substantial", "Often lighter"]

  - title: Treatments
    content: |
      Common coral treatments:
    subsections:
      - title: Dyeing
        content: |
          - Pale coral dyed to improve colour
          - Detection: Colour in crevices; acetone test
          - Very common in commercial material
          - Should be disclosed

      - title: Other Treatments
        content: |
          - **Bleaching**: Lightens orange to pink
          - **Waxing/oiling**: Improves lustre
          - **Impregnation**: Stabilises porous material
          - **Coating**: Surface enhancement

  - title: CITES and Conservation
    callout:
      type: warning
      title: Conservation Status
      text: |
        Many coral species are protected under CITES (Convention on International
        Trade in Endangered Species): [CITATION NEEDED]

        - Trade regulations vary by species and country
        - Documentation required for international trade
        - Some species banned from commercial harvest
        - Ethical alternatives available

        Always verify legality before purchase. Consider:
        - Vintage/antique coral (pre-ban)
        - Certified sustainable sources
        - Bamboo coral (different species, dyed)
        - Fossil coral (ancient, mineralised)

  - title: Imitations and Alternatives
    content: |
      Common coral substitutes:
    subsections:
      - title: Imitations
        table:
          headers:
            - Material
            - Distinction
          rows:
            - ["Dyed howlite", "Different structure; lighter; no effervescence"]
            - ["Plastic", "Warmer feel; lighter; no grain"]
            - ["Glass (paste)", "Heavier; may show bubbles"]
            - ["Pressed coral", "Reconstituted; grainy appearance"]

      - title: Ethical Alternatives
        content: |
          - **Bamboo coral**: Different species; often dyed
          - **Fossil coral**: Agatised ancient coral
          - **Synthetic coral**: Man-made alternatives
          - **Sponge coral**: Different structure

  - title: Care and Durability
    callout:
      type: warning
      title: Gentle Care Required
      text: |
        Coral is soft and sensitive:

        - **Hardness**: 3–4 (easily scratched)
        - **Acids**: Reacts with acids (including perspiration)
        - **Heat**: Can be damaged by heat
        - **Cleaning**: Warm water, soft cloth only
        - **Storage**: Separate from harder gems
        - **Wear**: Avoid contact with cosmetics, chemicals
