  - title: Special Care Gems
    content: |
      Four species deserve particular attention because they combine several risk factors at
      once:

      - **Opal**: soft, water-bearing, prone to crazing; never ultrasonic or steam; store dry,
        not in water (see Light and Heat Sensitivity, Storage Guidelines)
      - **Pearl**: soft, acid- and chemical-sensitive, organic; wipe only, apply cosmetics before
        putting pearls on (see Chemicals, Cosmetics and Metal Care)
      - **Emerald**: almost always fracture-filled; never ultrasonic, steam, or torch heat;
        expect occasional professional re-oiling (see Treatment-Specific Care)
      - **Tanzanite**: perfect cleavage combined with heat-sensitive colour; best reserved for
        earrings and pendants rather than daily-wear rings (see Toughness and Cleavage, Light
        and Heat Sensitivity)

  - title: Care Summary
    callout:
      type: tip
      title: Universal Care Rules
      text: |
        1. **Remove rings** during physical work, gardening, and sports
        2. **Put jewellery on last**, after cosmetics, perfume, and hairspray
        3. **Remove jewellery first**, before showering, swimming, or sleeping
        4. **Clean gently**, with the method appropriate to each gem
        5. **Store separately**, in soft, individual compartments
        6. **Inspect regularly** for loose settings and worn prongs
        7. **Know your gem**, its treatments, and its specific vulnerabilities

  - title: Caring for the Setting
    callout:
      type: info
      title: Metal Care
      text: |
        For caring for the metal your stone is set in – silver, gold, gold-filled – see the
