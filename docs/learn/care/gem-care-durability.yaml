  - jewellery
  - treatments

sections:
  - title: Introduction
    content: |
      Gemstone durability is the practical measure of how well a gem withstands everyday wear,
      cleaning, and storage. It rests on three distinct factors, hardness, toughness, and
      stability, and a gem suited to daily ring wear must perform adequately on all three, not
      just one. Hardness alone is insufficient: tanzanite reaches Mohs 6.5 yet its perfect
      cleavage makes it highly vulnerable during setting, while nephrite jade at Mohs 6-6.5 is
      among the toughest gem materials owing to its interlocking fibrous microstructure
      {cite:tarling-smith-2024-amphibole-jade}. Chemical and thermal stability add a further
      dimension: opal is an amorphous, water-bearing form of silica that can craze on drying or
      rapid heating {cite:gia-opal-care-cleaning}, pearls at Mohs 2.5-4.5 are attacked by mild
      acids and many household chemicals {cite:gia-pearl-care-cleaning}, and the resin or oil
      used to fill fractures in most commercial emeralds can exude or dry out under the heat of
      a jeweller's torch {cite:kammerling-1991}. Matching the correct cleaning method, setting,
      and storage regime to each species is therefore a core professional competency.
      {cite:martin-1987-gemstone-durability}{cite:read-2012-gemmology}

      This guide draws on GIA consumer-education pages and peer-reviewed gemmological research
      throughout. A small number of claims that are widely repeated in the trade but not yet
      documented in the literature are identified as such rather than given a citation they do
      not deserve.

  - title: The Three Durability Factors
    comparison:
      items:
        - title: Hardness
          points:
            - Resistance to scratching
            - Measured on the Mohs scale (1-10)
            - Determines everyday wear resistance
            - Gems below 7 pick up fine surface abrasion in normal wear
        - title: Toughness
          points:
            - Resistance to breaking and chipping
            - Governed by crystal structure and cleavage
            - Cleavage planes reduce toughness even in hard gems
            - Jade can be tougher than diamond despite far lower hardness
        - title: Stability
          points:
            - Resistance to light, heat, and chemicals
            - Some gems fade under prolonged light exposure
            - Some gems are damaged by heat, acids, or cosmetics
            - Central to long-term care and storage decisions

  - title: Hardness Considerations
    content: |
      The Mohs scale is ordinal, not linear: the interval between 9 and 10 (corundum to diamond)
      represents a far larger true hardness gap than the interval between, say, 2 and 3
      {cite:tabor-1954-mohs-hardness}{cite:read-2012-hardness-chapter}. Quartz (Mohs 7) and
      quartz-bearing dust are common in everyday environments, so gems softer than 7 gradually
      pick up fine surface abrasion during ordinary wear {cite:read-2012-gemmology}.
    table:
      caption: Hardness Categories for Jewellery
      headers:
        - Category
        - Hardness
        - Suitability
        - Examples
      rows:
        - ["Excellent", "8-10", "Daily ring wear", "Diamond, ruby, sapphire, chrysoberyl"]
        - ["Good", "7-7.5", "Everyday with care", "Quartz varieties, tourmaline, garnet, beryl"]
        - ["Fair", "6-7", "Occasional wear; protective settings", "Peridot, tanzanite, moonstone"]
        - ["Poor", "5-6", "Earrings/pendants; very careful ring use", "Opal, turquoise, apatite"]
        - ["Fragile", "<5", "Display or very protected wear", "Pearl, coral, amber"]

  - title: Toughness and Cleavage
    content: |
      Cleavage, the tendency of a crystal to break cleanly along specific crystallographic
      planes, significantly affects toughness independent of hardness
      {cite:read-2012-cleavage-chapter}. Even very hard gems can be brittle where cleavage is
      present.
    subsections:
      - title: High-Risk Cleavage Gems
        content: |
          Diamond, topaz, kunzite, and tanzanite are the four cleavage risks documented in the
          principal gemstone-durability review used for this table
          {cite:martin-1987-gemstone-durability}. Fluorite and moonstone cleavage are separately
          sourced from a gemmological reference dictionary
          {cite:manutchehr-danai-cleavage-of-fluorite}{cite:manutchehr-danai-feldspar-moonstone},
          since the durability review does not cover either species.
        table:
          headers:
            - Gem
            - Cleavage
            - Risk
          rows:
            - ["Diamond", "Perfect octahedral {111}", "Can cleave with a sharp blow {cite:martin-1987-gemstone-durability}"]
            - ["Topaz", "Perfect basal {001}", "Very prone to chipping in prong settings {cite:martin-1987-gemstone-durability}"]
            - ["Kunzite", "Perfect prismatic, two directions", "Extremely fragile for ring settings {cite:martin-1987-gemstone-durability}"]
            - ["Tanzanite", "Perfect {010}", "Easily damaged during setting {cite:martin-1987-gemstone-durability}"]
            - ["Fluorite", "Perfect octahedral {111}", "Very brittle; cleaves with light pressure {cite:manutchehr-danai-cleavage-of-fluorite}"]
            - ["Feldspar (moonstone)", "Perfect in two directions", "Prone to chipping along cleavage {cite:manutchehr-danai-feldspar-moonstone}"]

      - title: Impact Damage
        content: |
          Beyond cleavage, sharp impacts can chip facet edges and girdles even on tough,
          non-cleaving gems. Worn or abraded facet edges on older cut diamonds have been
          documented as a recognisable long-term wear pattern
          {cite:webster-1963-worn-edges-diamonds}. Protective settings reduce this risk for
          daily-wear rings (see Setting Recommendations below).

      - title: Tough Gems
        content: |
          Some gems have exceptional toughness despite only moderate hardness:

          - **Nephrite jade** (Mohs 6-6.5): interlocking fibrous amphibole structure gives
            exceptional toughness relative to its hardness {cite:tarling-smith-2024-amphibole-jade}
          - **Jadeite** (Mohs 6.5-7): granular interlocking pyroxene structure {cite:reller-1993-jade}
          - **Chalcedony** (Mohs 7): microcrystalline quartz aggregate

          These polycrystalline gems resist chipping better than single-crystal gems of equal or
          even higher hardness.

  - title: Cleaning Methods
    content: |
      Different gems require different cleaning approaches. Using the wrong method can cause
      permanent damage.
    subsections:
      - title: Safe Cleaning Methods
        table:
          headers:
            - Method
            - Description
            - Safe For
            - Never Use For
          rows:
            - ["Warm soapy water", "Mild dish soap, soft brush", "Most gems", "Porous gems (turquoise, lapis lazuli)"]
            - ["Ultrasonic", "Sound waves drive cavitation in the cleaning solution", "Diamond, ruby, sapphire, garnet, spinel (untreated or heated)", "Emerald, tanzanite, opal, pearl, filled or coated stones"]
            - ["Steam", "High-pressure steam jet", "Diamond, ruby, sapphire (untreated or heated)", "Filled gems, porous gems, organic gems, heat-sensitive gems"]
            - ["Dry brush or soft cloth", "No liquid", "Porous and organic gems", "N/A (gentle method)"]

      - title: Ultrasonic Cleaning Safety
        content: |
          Ultrasonic cleaners use high-frequency sound waves to drive cavitation, the rapid
          formation and collapse of microscopic bubbles in the cleaning solution, which
          dislodges surface dirt
          {cite:chahine-2016-cavitation-bubble-collapse}{cite:mason-1999-ultrasonic}. The same
          energy that removes dirt can also:

          - Strip or damage fracture-filling oils and resins in emerald {cite:kammerling-1991}
          - Loosen glass fillers in lead-glass-filled ruby {cite:mcclure-2006-lead-glass-ruby}
          - Dislodge fillers in clarity-enhanced diamonds {cite:kammerling-1994}
          - Propagate existing fractures in gems with pronounced cleavage
          - Damage organic gems such as pearl and amber

      - title: Steam Cleaning Safety
        content: |
          Steam cleaning combines heat and moisture and is a documented risk for oiled or
          resin-filled emerald
          {cite:kammerling-1991}{cite:johnson-2007-durability-filled-emeralds}, lead-glass-filled
          ruby {cite:mcclure-2006-lead-glass-ruby}, filled diamonds {cite:kammerling-1994}, and
          opal, where rapid temperature change can encourage crazing
          {cite:chauvire-2023-cracking-gem-opals}.

  - title: Cleaning Safety Chart
    content: |
      The following chart follows GIA's own gem-by-gem care and cleaning guidance.
    table:
      caption: Cleaning Method Safety by Gem
      headers:
        - Gem
        - Warm Soapy Water
        - Ultrasonic
        - Steam
      rows:
        - ["Diamond (untreated)", "Safe {cite:gia-diamond-care-cleaning}", "Usually safe {cite:gia-diamond-care-cleaning}", "Usually safe {cite:gia-diamond-care-cleaning}"]
        - ["Ruby / Sapphire (untreated or heated)", "Safe {cite:gia-ruby-care-cleaning}{cite:gia-sapphire-care-cleaning}", "Usually safe {cite:gia-ruby-care-cleaning}{cite:gia-sapphire-care-cleaning}", "Usually safe {cite:gia-ruby-care-cleaning}{cite:gia-sapphire-care-cleaning}"]
        - ["Emerald (oiled/filled)", "Safe {cite:gia-emerald-care-cleaning}", "Never {cite:gia-emerald-care-cleaning}", "Never {cite:gia-emerald-care-cleaning}"]
        - ["Aquamarine", "Safe {cite:gia-aquamarine-care-cleaning}", "Usually safe {cite:gia-aquamarine-care-cleaning}", "Usually safe {cite:gia-aquamarine-care-cleaning}"]
        - ["Tanzanite", "Safe {cite:gia-tanzanite-care-cleaning}", "Never {cite:gia-tanzanite-care-cleaning}", "Never {cite:gia-tanzanite-care-cleaning}"]
        - ["Tourmaline", "Safe {cite:gia-tourmaline-care-cleaning}", "Usually safe {cite:gia-tourmaline-care-cleaning}", "Caution {cite:gia-tourmaline-care-cleaning}"]
        - ["Opal", "Caution {cite:gia-opal-care-cleaning}", "Never {cite:gia-opal-care-cleaning}", "Never {cite:gia-opal-care-cleaning}"]
        - ["Pearl", "Wipe with soft cloth only {cite:gia-pearl-care-cleaning}", "Never {cite:gia-pearl-care-cleaning}", "Never {cite:gia-pearl-care-cleaning}"]
        - ["Turquoise", "Damp soft cloth only {cite:gia-turquoise-care-cleaning}", "Never {cite:gia-turquoise-care-cleaning}", "Never {cite:gia-turquoise-care-cleaning}"]
        - ["Peridot", "Safe {cite:gia-peridot-care-cleaning}", "Caution {cite:gia-peridot-care-cleaning}", "Never {cite:gia-peridot-care-cleaning}"]
        - ["Topaz", "Safe {cite:gia-topaz-care-cleaning}", "Caution {cite:gia-topaz-care-cleaning}", "Never {cite:gia-topaz-care-cleaning}"]
        - ["Garnet", "Safe {cite:gia-garnet-care-cleaning}", "Usually safe {cite:gia-garnet-care-cleaning}", "Usually safe {cite:gia-garnet-care-cleaning}"]
        - ["Amethyst", "Safe {cite:gia-amethyst-care-cleaning}", "Usually safe {cite:gia-amethyst-care-cleaning}", "Usually safe {cite:gia-amethyst-care-cleaning}"]
        - ["Spinel", "Safe {cite:gia-spinel-care-cleaning}", "Usually safe {cite:gia-spinel-care-cleaning}", "Usually safe {cite:gia-spinel-care-cleaning}"]
        - ["Kunzite", "Safe {cite:gia-kunzite-care-cleaning}", "Never {cite:gia-kunzite-care-cleaning}", "Never {cite:gia-kunzite-care-cleaning}"]

  - title: Light and Heat Sensitivity
    content: |
      Several gem species are sensitive to prolonged light exposure, heat, or both, independent
      of their hardness or cleavage.
    subsections:
      - title: Kunzite
        content: |
          Kunzite, the pink-to-lilac variety of spodumene, owes its colour to manganese-related
          colour centres that are documented to bleach under prolonged strong light or heat
          {cite:claffy-1953-spodumene-tenebrescence}{cite:schmitz-lehmann-1975-mn-color-centers-spodumene}.
          GIA's consumer guidance confirms the practical consequence: kunzite can fade with
          extended exposure to heat or intense light {cite:gia-kunzite-care-cleaning}. Store
          kunzite away from strong light and heat, and out of direct sun in a display case.

      - title: Amethyst
        content: |
          Some amethyst colour can fade with prolonged exposure to intense light
          {cite:gia-amethyst-care-cleaning}. This is a separate phenomenon from the well-studied
          heat- and irradiation-induced colour change between the amethyst and citrine forms of
          quartz, driven by iron-related colour centres
          {cite:nassau-1981-amethyst}{cite:cheng-guo-2020-amethyst-heat-treatment}. Amethyst
          should be kept away both from strong display lighting and from direct heat.

      - title: Rose Quartz
        content: |
          Rose quartz's colour stability under normal wear is not well documented in the
          scientific literature; as a precaution, avoid prolonged direct sun exposure and very
          hot conditions.

      - title: Brown and Irradiated Topaz
        content: |
          Natural brown topaz can lose colour on exposure to light and heat, a phenomenon
          documented in early studies of colour alteration in topaz
          {cite:nassau-1985-altering-color-topaz}; heat can also visibly alter mineral
          inclusions within topaz {cite:kammerling-koivula-1989-topaz-inclusions}. Irradiated
          blue topaz, the most common topaz colour on the market, is considered stable under
          normal wear and light exposure, though as with any colour-treated stone it should
          still be kept away from prolonged high heat during repairs (see Treatment-Specific
          Care below).

      - title: Maxixe-Type Beryl
        content: |
          Deep blue "Maxixe" and Maxixe-type beryl owes its saturated colour to unstable
          radiation-induced colour centres and is strongly documented to fade on exposure to
          light, in some cases within weeks of display
          {cite:nassau-wood-1973-maxixe-beryl}{cite:nassau-prescott-1981-nonfading-maxixe-beryl}.
          This material should be stored in the dark and treated as display-only.

      - title: Opal
        content: |
          Opal is an amorphous, hydrous form of silica whose water content contributes to
          crazing, a network of fine internal cracks {cite:gia-opal-care-cleaning}. Controlled
          heating experiments show that opal stored in water cracks at markedly lower
          temperatures once it later dries out than opal stored in air, and that for
          water-stored material the cracking is linked to drying shrinkage rather than
          superheated-water decrepitation {cite:chauvire-2023-cracking-gem-opals}. In practice
          this means water storage does not protect opal from crazing and may make it more
          vulnerable once it is removed from water (see Storage Guidelines below).

      - title: Tanzanite
        content: |
          Heat measurably changes tanzanite's colour: laboratory heat treatment shifts natural
          brownish, trichroic material toward the pure violet-to-blue dichroism seen in most
          commercial stones, an effect attributed to vanadium as the principal colouring agent
          {cite:pluthametwisute-2020-tanzanite-heat-treatment}{cite:thongnopkun-2018-tanzanite-heat}.
          This colour sensitivity is distinct from the risk of physical fracture: tanzanite's
          perfect cleavage makes sudden temperature change a plausible mechanical hazard, though
          this specific fracture mechanism has not been directly studied. As a precaution, avoid
          sudden temperature swings and never use ultrasonic or steam cleaning
          {cite:gia-tanzanite-care-cleaning}. General thermal behaviour of the zoisite mineral
          group provides supporting background {cite:newton-1965-zoisite}.

      - title: Turquoise and Chrysoprase
        content: |
          Turquoise and chrysoprase are both sometimes reported to dull or dehydrate with age
          and exposure to heat or dry air, but this is not well documented in peer-reviewed
          gemmological literature. [CITATION NEEDED] Keep both away from direct heat as a
          precaution, and see Chemicals, Cosmetics and Metal Care below for turquoise's
          separately well-documented chemical sensitivity.

  - title: Chemicals, Cosmetics and Metal Care
    content: |
      Many gems, and the metal alloys that hold them, are vulnerable to common household and
      cosmetic chemicals.
    subsections:
      - title: Pearls
        content: |
          Pearl nacre can be damaged by many chemicals and all acids, including hair spray,
          perfume, cosmetics, and even perspiration {cite:gia-pearl-care-cleaning}. Trade
          practice accordingly recommends putting pearls on last, after cosmetics and perfume
          have been applied, and taking them off first; this sequencing is standard trade
          practice rather than a documented finding in its own right, but it follows directly
          from pearls' well-documented chemical sensitivity {cite:gia-pearl-care-cleaning}. Wipe
          pearls with a soft cloth after wearing; never clean them ultrasonically or with steam.

      - title: Chlorine and Metal Alloys
        content: |
          Chloride ions are documented in laboratory testing to cause stress-corrosion cracking
          in low-karat gold alloys
          {cite:rapson-1996-gold-alloy-corrosion}{cite:ward-2013-gold-alloy-nacl-corrosion}{cite:neumeyer-2009-gold-scc-screening}.
          Chlorinated pool and spa water is a chloride source, so although these specific
          studies tested laboratory salt solutions rather than pool water directly, extending
          their finding to swimming and hot-tub use is a reasonable precaution: remove gold
          jewellery before swimming in chlorinated water.

      - title: Turquoise
        content: |
          Turquoise is porous and can be discoloured by skin oils, cosmetics, and other
          chemicals, and dissolves slowly in hydrochloric acid {cite:gia-turquoise-care-cleaning}.
          Some commercial turquoise is treated to reduce this porosity and its tendency to
          absorb discolouring agents {cite:fritsch-1999-zachery-turquoise}. Clean turquoise with
          a soft, slightly damp cloth only, never with solvents or ultrasonic cleaning.

      - title: Coral and Malachite
        content: |
          Coral is a calcium-carbonate skeletal material {cite:grillo-1993-coral-skeleton} and
          malachite is a copper carbonate mineral {cite:perchiazzi-merlino-2006-malachite}; both
          are attacked by acids, including many common household and cosmetic products, and both
          scratch and etch easily. Clean both with a soft dry cloth only.

      - title: Amber
        content: |
          Amber can be damaged by many chemicals, including perfume, hairspray, and cleaning
          solvents, and the only safe cleaning method is warm soapy water
          {cite:gia-amber-care-cleaning}. Amber's solubility in organic solvents is well enough
          established that solvent treatment is itself used as an analytical technique to
          recover fossil pollen and spores trapped inside it {cite:halbwachs-2020-amber-solvent},
          illustrating how reactive the surface is.

      - title: Lapis Lazuli
        content: |
          Lapis lazuli is often dyed to even out its colour, and this dye can be removed by
          acetone or denatured alcohol; the wax sometimes used to seal the surface can also
          deteriorate with heat or solvents {cite:gia-lapis-lazuli-care-cleaning}. Test any
          cleaning method on an inconspicuous area first, and avoid solvents and prolonged heat.

  - title: Setting Recommendations
    content: |
      The choice of setting can protect vulnerable gems or expose durable gems to show their
      beauty to best effect.
    subsections:
      - title: Protective Settings
        table:
          headers:
            - Setting Type
            - Protection Level
            - Best For
          rows:
            - ["Bezel", "High", "Soft gems, cleavage-prone gems"]
            - ["Half-bezel", "Moderate", "Balance of protection and light"]
            - ["Flush/gypsy", "Very high", "Rings for active wearers"]
            - ["Halo", "Moderate", "Central stone protected by smaller surrounding stones"]

      - title: Exposed Settings
        table:
          headers:
            - Setting Type
            - Protection Level
            - Requires
          rows:
            - ["Prong/claw", "Low", "Hardness 7+ for rings"]
            - ["Tension", "Low", "Very hard, tough gems only"]
            - ["Bar", "Low to moderate", "Harder gems preferred"]

      - title: Setting by Gem Type
        content: |
          **Recommended for prong settings (rings):**
          Diamond, ruby, sapphire, chrysoberyl, spinel

          **Recommend bezel or other protective settings:**
          Emerald, tanzanite, opal, moonstone, tourmaline, peridot

          **Best avoided in daily-wear rings:**
          Kunzite, fluorite, pearl (unless in a protective setting)

  - title: Storage Guidelines
    subsections:
      - title: Separation
        content: |
          - Store gems individually, in separate soft pouches or fabric-lined compartments, not
            loose together
          - A diamond can scratch any other gem material, and can also scratch the precious
            metal of another piece's setting {cite:gia-diamond-care-cleaning}
          - Softer gems should never share a compartment with harder ones

      - title: Light and Temperature
        content: |
          - Store light-fading gems, kunzite, amethyst, brown topaz, and Maxixe-type beryl, away
            from strong or prolonged light
            {cite:gia-kunzite-care-cleaning}{cite:gia-amethyst-care-cleaning}{cite:gia-topaz-care-cleaning}
          - Avoid extreme or fluctuating temperatures; stable room temperature and humidity suit
            most gems best

      - title: Opal
        content: |
          Do not store opal in water or on damp cotton wool, despite this being long-standing
          trade advice. Peer-reviewed testing shows that water-saturated opal actually cracks at
          lower temperatures once it later dries {cite:chauvire-2023-cracking-gem-opals}, so
          wetting opal relocates rather than removes the crazing risk. Only certain Ethiopian
          hydrophane opal varieties genuinely absorb and release water reversibly without damage
          {cite:rondeau-2010-ethiopia-opal}, and these should be identified by a gemmologist
          rather than assumed. Ordinary precious opal should be stored dry, away from extreme
          heat and rapid temperature change, and not sealed in an airtight container.

      - title: Pearls
        content: |
          Dry strung pearls fully before wearing or storing them, since damp string encourages
          stretching and mildew {cite:gia-pearl-care-cleaning}. Store pearls flat, away from
          harder gems that could scratch the nacre.

      - title: Special Storage Needs
        table:
          headers:
            - Gem
            - Special Requirements
          rows:
            - ["Opal", "Store dry; avoid extreme heat and rapid temperature change {cite:gia-opal-care-cleaning}{cite:chauvire-2023-cracking-gem-opals}"]
            - ["Pearl", "Dry fully before storing; lay flat, away from harder gems {cite:gia-pearl-care-cleaning}"]
            - ["Kunzite / Amethyst / Maxixe beryl / Brown topaz", "Store away from strong or prolonged light {cite:gia-kunzite-care-cleaning}{cite:gia-amethyst-care-cleaning}"]
            - ["Amber", "Away from solvents, perfume, and heat {cite:gia-amber-care-cleaning}"]
            - ["Turquoise / Coral / Malachite", "Away from oils, cosmetics, and acids {cite:gia-turquoise-care-cleaning}"]

  - title: Treatment-Specific Care
    content: |
      Most gems on the market today carry at least one treatment. Disclosure obligations for
      those treatments are covered in the [treatment disclosure](/learn/market/disclosure/)
      guide; this section focuses on the practical care consequences of the most common ones.
    subsections:
      - title: Oiled and Resin-Filled Emeralds
        content: |
          Nearly all commercial emerald is fracture-filled with oil or resin (traditionally
          cedarwood oil, more recently synthetic resins such as Opticon) to reduce the
          visibility of surface-reaching fractures {cite:kammerling-1991}{cite:nassau-1994-emerald}.
          A dedicated durability study of 128 filled emeralds found that around 35% changed
          detectably after mild exposure testing, with liquid oil fillers the most susceptible
          to ultrasonic cleaning and to solvents such as ethanol and acetone; the study
          recommends cleaning with soap and water only, and professional re-oiling or resealing
          when a filler visibly degrades {cite:johnson-2007-durability-filled-emeralds}. Never
          use ultrasonic or steam cleaning, and keep filled emeralds away from a jeweller's torch
          and other high-heat repair work {cite:johnson-1999-emerald}.

      - title: Lead-Glass-Filled Ruby
        content: |
          Ruby with large fractures is increasingly filled with high-lead-content glass, a
          treatment classed by consumer-protection regulators as producing a composite stone
          rather than ruby (see [treatment disclosure](/learn/market/disclosure/)). Lead-glass
          filling is markedly less durable than traditional oil or resin filling in emerald: the
          glass filler can be attacked by common household chemicals, dissolved by lemon juice
          and other mild acids, and can even melt under the heat of a jeweller's torch during
          routine repair work {cite:mcclure-2006-lead-glass-ruby}. Clean lead-glass-filled ruby
          with a soft cloth and mild soap only; never use ultrasonic or steam cleaning, and warn
          a repair jeweller before any torch work.

      - title: Fracture-Filled Diamonds
        content: |
          Diamonds with fractures reaching the surface are sometimes filled with a
          high-refractive-index glass to make the fracture less visible. The filler is
          documented to be vulnerable to the heat of jewellery repair, to ultrasonic cleaning,
          and to some jewellery-cleaning chemicals, and can visibly change or become dislodged as
          a result {cite:koivula-1989-filled-diamonds}{cite:kammerling-1994}. Clean filled
          diamonds with a soft cloth and mild soap only, and inform any jeweller carrying out
          repairs or resizing that the stone is filled.

      - title: Heat-Treated and Beryllium-Diffused Corundum
        content: |
          Heat treatment is the most widely accepted enhancement in the ruby and sapphire trade,
          and heat-treated stones are generally considered as durable as untreated stones for
          normal wear, cleaning, and repair
          {cite:emmett-2003-beryllium-diffusion}{cite:gia-ruby-care-cleaning}{cite:gia-sapphire-care-cleaning}.
          Some yellow sapphire colour types are more light- or heat-sensitive than others
          depending on their colour origin {cite:nassau-valente-1987-yellow-sapphire}, so care
          recommendations can vary by colour type. Beryllium-diffused corundum is the exception
          to the "no special care" rule: the diffused colour layer is extremely thin, and
          repolishing or recutting facets on a beryllium-diffused stone can remove the colour
          layer entirely {cite:emmett-2003-beryllium-diffusion}.

      - title: Dyed Materials
        content: |
          Dyed gem materials, including dyed chalcedony, jade, and pearls, are reviewed in the
          gemmological literature primarily as an identification challenge
          {cite:mcclure-2010-gemstone-enhancement}. Whether the dye itself fades under normal
          light exposure is not well documented for most dyed materials. [CITATION NEEDED] As a
          precaution, clean dyed gems with a soft cloth and mild soap only, avoid solvents, and
          keep them out of prolonged strong light.

      - title: Coated Stones
        content: |
          Surface coatings, used for example to enhance the blue-violet colour of some
          tanzanite, sit on the surface of the stone rather than penetrating it, and can be
          scratched, worn away by everyday abrasion, or removed by solvents and ultrasonic
          cleaning {cite:mcclure-2008-coated-tanzanite}{cite:mcclure-2010-gemstone-enhancement}.
          Clean coated stones with a soft dry cloth only, and treat any coating as cosmetic and
          temporary rather than permanent.

      - title: Irradiated and HPHT-Treated Stones
        content: |
          Irradiated blue topaz is considered colour-stable under normal wear and light exposure
          once appropriately treated and settled to safe radioactivity levels; the main care
          concern is the same cleavage-related caution that applies to all topaz (see Toughness
          and Cleavage above). High-pressure high-temperature (HPHT) treatment of diamond is
          reported to produce a permanent colour change under normal conditions, though the
          original studies establishing this are not independently retrievable, so the claim
          rests on secondary review rather than a directly checkable primary source
          {cite:mcclure-2010-gemstone-enhancement}. As with any treated diamond, avoid
          unnecessary exposure to extreme heat during repair work.

