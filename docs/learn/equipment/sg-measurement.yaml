  - title: Sources of Error
    content: |
      The following errors are common in hydrostatic SG measurement:
    subsections:
      - title: Measurement Errors
        content: |
          - **Air bubbles on the stone surface** – reduce the apparent weight of displaced water,
            giving a falsely high SG reading. Remove by gently agitating or by using a wetting
            agent in the water.
          - **Mounted stones** – metal settings introduce unknown mass; the method is unreliable
            for set stones without dismounting.
          - **Porous or treated stones** – water absorption (opal, turquoise, some coral) alters
            the reading over time as the stone absorbs liquid.
          - **Very small stones** – weighing error becomes proportionally large; minimum useful
            stone weight is approximately 0.15–0.20 g for ±0.01 g balance resolution.
          - **Fracture-filled stones** – filler material (glass, resin) changes the apparent SG
            from the host mineral.

      - title: Balance Calibration
        content: |
          - Check balance calibration before each session using a stone of known SG.
          - **Quartz (SG 2.65)** is a convenient and inexpensive reference standard.
          - If readings on a reference stone deviate by more than ±0.02, recalibrate the balance
            before continuing.

