sections:
  - title: Introduction
    content: |
      Specific gravity (SG) is the ratio of a gem's weight in air to the weight of an equal
      volume of water at 4 °C. It is measured by hydrostatic weighing: the gem is weighed in air
      (W_air), then suspended in water (W_water), and SG = W_air ÷ (W_air − W_water), corrected
      for water temperature. SG is density-dependent and therefore characteristic of chemical
      composition, making it a reliable secondary confirmation after refractive index.

      Diamond (3.52), corundum (3.99–4.05), and zircon (3.93–4.73) each have distinctive values.
      Errors arise from air bubbles adhering to the stone during water weighing — these increase
      the apparent buoyancy, giving a falsely high reading — and from fracture-filled stones where
      the filler material alters the effective density. The tolerance for most gem species is
      approximately ±0.02–0.03. SG measurement is a Foundation-required skill (Gem-A FS5) and a
      standard part of any complete gemstone identification sequence. {cite:farrimond-1994-sg}

  - title: Hydrostatic Balance Principle
    content: |
      The hydrostatic method applies Archimedes' principle: a body immersed in a liquid experiences
      an upward buoyant force equal to the weight of the displaced liquid.

      **Formula:**

      > SG = W_air / (W_air − W_water)

      Where:
      - **W_air** = weight of the stone in air (grams)
      - **W_water** = apparent weight of the stone when fully immersed in water (grams)
      - **(W_air − W_water)** = buoyancy force = weight of displaced water = weight of equal
        volume of water

      The denominator is the key: it gives the weight of a volume of water equal to the stone's
      volume, and dividing the stone's mass by that gives the density ratio relative to water.

      Farrimond (1994) provides a practical account of this method for gemmological use:
      Journal of Gemmology 24(3), 161–163 (DOI: 10.15506/jog.1994.24.3.161) [VERIFIED]. {cite:farrimond-1994-sg}

  - title: Equipment Setup
    content: |
      A standard hydrostatic SG setup uses readily available laboratory equipment.
    subsections:
      - title: Required Components
        content: |
          - **Analytical balance** – single-pan electronic or two-pan beam balance; ±0.01 g
            resolution minimum (±0.001 g preferred for stones below 0.5 g)
          - **Bridge or cradle frame** – mounted over or beside the balance pan; holds the beaker
            of water while the stone hangs suspended below on a wire
          - **Fine wire sling or fibre-basket** – suspends the stone fully immersed without
            touching the beaker walls or base
          - **Beaker of distilled water** with one drop of wetting agent (household detergent) to
            reduce surface tension and prevent air bubbles
          - **Thermometer** – for temperature corrections if precision is required
          - **Tweezers** – for stone handling; avoid fingers which add grease

      - title: Procedure
        content: |
          1. Tare the balance with the wire sling hanging freely in air above the beaker.
          2. Place the stone in the sling, lower it so it hangs freely in air. Record **W_air**.
          3. Raise the beaker of distilled water so the stone is fully immersed – check no
             air bubbles are visible on the stone surface; gently agitate if needed.
          4. Record **W_water** (the apparent weight under water – numerically less than W_air).
          5. Calculate: **SG = W_air / (W_air − W_water)**.
          6. Repeat at least twice; take the mean.

          **Worked example:** W_air = 2.50 g; W_water = 1.60 g
          → SG = 2.50 / (2.50 − 1.60) = 2.50 / 0.90 = 2.78 → consistent with beryl.

      - title: Temperature Corrections
        content: |
          Water density varies with temperature. At 4 °C the density is 1.0000 g/cm³ (the
          standard reference). At 25 °C it is 0.9971 g/cm³.

          For most gemmological work (accuracy to ±0.02 SG units) no correction is needed at
          typical room temperature (18–25 °C). For precision work, multiply the result by the
          actual water density at the measured temperature.

  - title: Heavy Liquids for Rapid SG Bracketing
    content: |
      Heavy liquids are dense organic or inorganic liquids used for density-based separation
      without weighing. A stone denser than the liquid sinks; a stone less dense floats; a stone
      of equal density suspends (hovers mid-liquid).

      This gives a rapid qualitative SG bracket in seconds. Liquids may be diluted (with acetone
      for organic liquids, or water for sodium polytungstate) to adjust density to intermediate
      values. Shannon (1985) described the gemmological use of heavy liquids in Gems & Gemology
      (DOI: 10.1080/00357529.1985.11764366) [PARTIALLY_SUPPORTED – title and DOI confirmed;
      abstract not retrieved].
    table:
      caption: Heavy Liquids Used in Gemmological Laboratories
      headers:
        - Liquid
        - Common Name
        - Density (g/cm³)
        - Hazard Class
        - Status
      rows:
        - ["Di-iodomethane (CH₂I₂)", "Methylene iodide", "~3.32 at 20 °C", "Toxic vapour; photodegrades; stains skin", "Still in common use – handle in fume cupboard"]
        - ["Bromoform (CHBr₃)", "Bromoform", "~2.89 at 20 °C", "Toxic; suspected carcinogen; volatile", "Being phased out in many laboratories"]
        - ["Clerici solution (thallium formate–malonate)", "Clerici", "Up to ~4.2 (adjustable)", "Acutely toxic – thallium absorbed through skin", "Banned or restricted in many jurisdictions; avoid"]
        - ["Sodium polytungstate (Na₆[H₂W₁₂O₄₀])", "SPT", "~2.7–3.1 (adjustable with water)", "Non-toxic; water-soluble", "Modern alternative; does not reach 3.32+ SG range"]

  - title: Safety
    callout:
      type: warning
      title: Heavy Liquid Hazards – Read Before Use
      text: |
        **Clerici solution** is the most dangerous heavy liquid used in gemmological laboratories.
        It contains thallium salts; thallium is absorbed through intact skin and mucous membranes,
        accumulates in the body, and is acutely toxic. Many UK laboratories have discontinued its
        use under COSHH regulations. Where Clerici is still used: full PPE (nitrile gloves, fume
        cupboard, closed containers) is mandatory. **Never use Clerici without training.**

        **Di-iodomethane:** toxic vapour – use in ventilated area or fume cupboard.
        Photodegrades on exposure to light/air (turns brown/orange; store in amber bottles).
        Can irreversibly stain organic gems (pearls, amber, coral) – not suitable for these.

        **Bromoform:** volatile, toxic, possible carcinogen; not to be used without fume cupboard.

        **Sodium polytungstate (SPT):** non-toxic modern alternative. Maximum achievable SG ~3.1;
        cannot reach the 3.32+ range needed for separation near di-iodomethane threshold.

        Munsterman & Kerstholt (1996) introduced SPT as a "non-toxic alternative to bromoform":
        Review of Palaeobotany and Palynology 91, 417–422 (DOI: 10.1016/0034-6667(95)00093-3)
        [VERIFIED]. {cite:munsterman-1996-spt}

