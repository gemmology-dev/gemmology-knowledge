sections:
  - title: Introduction
    content: |
      The Chelsea Colour Filter (CCF) is a compact hand-held optical filter that acts as a rapid
      chromophore discriminator, separating chromium-coloured gems from iron-coloured ones in
      seconds. Developed at the Chelsea School of Art (London) in the 1930s and documented in the
      Journal of Gemmology in 1949 {cite:ccf-1949-jog}, it transmits two narrow windows — around
      570–580 nm (yellow-green) and 620–700 nm (red) — while absorbing the intervening wavelengths.

      Chromium-bearing stones absorb yellow-green and transmit red, appearing pink or red; iron-
      dominated stones appear greenish or inert. Anderson (1966) established the key limitation:
      the filter detects chromium, not natural or synthetic origin. {cite:anderson-1966-ccf}
      Colombian emerald (strong Cr³⁺) appears strong red; Zambian emerald (elevated Fe) may
      appear only weakly red to inert. Cobalt-coloured synthetic spinel and cobalt glass both
      appear strong red — a diagnostic for those simulants. The CCF must always be used under
      incandescent (tungsten) light; LED sources shift the colour balance and produce unreliable
      results. It is a screening clue only, never a definitive identification.

  - title: Optical Principle
    content: |
      The CCF is a composite filter containing two glass elements:

      - **Didymium glass** — absorbs the mid-green and yellow-green region (~540–580 nm), removing
        the wavelengths that would otherwise appear as a green wash.
      - **Cobalt-blue glass** — absorbs red and part of the blue-green region.

      The combined result leaves two narrow transmission windows:
      1. ~570–580 nm (yellow-green)
      2. ~620–700 nm (red)

      A chromophore that absorbs yellow-green but transmits red will make the stone appear
      **red or pink** through the filter. A chromophore that transmits yellow-green but absorbs
      red will make the stone appear **greenish**. {cite:nassau-2001-color}

      This makes the CCF a practical **chromium (Cr³⁺) versus iron (Fe²⁺/Fe³⁺) discriminator**:
      chromium-coloured stones tend to appear red or pink; iron-coloured stones appear greenish or
      inert. Anderson (1966) established this principle clearly: the filter "tells us only that
      chromium is present, not that the stone is natural". {cite:anderson-1966-ccf}

  - title: How to Use the Filter
    content: |
      Correct procedure is essential — the wrong light source gives unreliable results.
    subsections:
      - title: Lighting Requirements
        content: |
          Use **incandescent (tungsten) illumination only**. Do not use:
          - LED sources (shift the red-to-green balance)
          - Daylight or daylight-balanced fluorescent (too much blue component)
          - Mixed or unknown light sources

          A simple incandescent penlight or a bench lamp with a tungsten bulb is sufficient.

      - title: Observation Procedure
        content: |
          1. Hold the filter close to the eye (as close as comfortable).
          2. Hold the stone close to — but not touching — the incandescent light source,
             or direct a penlight through or against the stone.
          3. Observe the colour and record as one of: strong red / weak red / pink / inert /
             weak greenish / green.
          4. Always cross-reference with RI and spectroscope data — the CCF result alone is
             never diagnostic.

  - title: Species Reactions
    content: |
      The table below summarises expected CCF reactions for common gem species. Reactions reflect
      standard incandescent illumination. Anomalous results require immediate investigation with a
      second instrument.

      Note: **the CCF does not distinguish natural from synthetic** — a chromium-dominated
      synthetic will react identically to a natural stone of the same chromophore.
