title: Tenebrescence
description: Tenebrescence – reversible photochromic colour change in hackmanite driven by S₂⁻ radical colour centres, mechanism, named species, and diagnostic distinction from the alexandrite effect and irradiation-induced colour changes.
order: 15
category: phenomena
difficulty: advanced
icon: sun
