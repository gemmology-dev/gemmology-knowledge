title: Fluorescence and Phosphorescence
description: Fluorescence and phosphorescence in gemstones – Stokes shift mechanism, LWUV vs SWUV regimes, species reaction table, phosphorescence afterglow, and diagnostic applications for natural vs synthetic identification.
order: 12
category: phenomena
difficulty: intermediate
icon: zap
related:
