title: Play of Colour
description: Play of colour in precious opal including cause, pattern types, body tones, and quality assessment.
order: 6
category: phenomena
difficulty: intermediate
icon: palette
related:
  - index
  - species/opal
  - phenomena/iridescence
tags:
