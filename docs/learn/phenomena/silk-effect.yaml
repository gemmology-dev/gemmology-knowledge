title: Silk Effect
description: The silk effect in Kashmir sapphire and Burmese ruby — velvety appearance from rutile-needle clouds, mechanism, distinction from asterism, and diagnostic significance for origin and heat-treatment detection.
order: 11
category: phenomena
difficulty: intermediate
icon: feather
related:
