title: Fire and Dispersion
description: "Fire in faceted gemstones: dispersion as differential refraction by wavelength, the B–G interval, named dispersion values, relationship to facet design, and distinction from diffraction-based spectral effects."
order: 13
category: phenomena
difficulty: intermediate
icon: flame
