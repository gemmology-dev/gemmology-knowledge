title: Schiller and Peristerescence
description: Schiller and peristerescence in feldspar – the mechanism of non-spectral lamellar scattering, named species, and distinction from adularescence, labradorescence, aventurescence, and chatoyancy.
order: 10
category: phenomena
difficulty: intermediate
icon: layers
