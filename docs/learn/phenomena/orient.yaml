title: Pearl Orient
description: Pearl orient – the soft iridescent surface bloom of fine nacre, arising from thin-film diffraction and interference at aragonite tablet layers, distinguished from body colour, lustre, and fluorescence.
order: 14
category: phenomena
difficulty: intermediate
icon: gem
related:
  - phenomena/overview
  - phenomena/iridescence
  - phenomena/play-of-colour
tags:
  - phenomena/orient
  - pearl
