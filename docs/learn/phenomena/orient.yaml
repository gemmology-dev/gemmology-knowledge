        - Test
      rows:
        - ["Orient", "Thin-film diffraction/interference in nacre aragonite layers", "Yes – defining feature of fine nacre", "Visible under ordinary white light; soft multi-tonal iridescence"]
        - ["Body colour", "Organic pigment (porphyrins) + optical depth effects", "Yes", "Colour visible in direct light; does not shift spectrally with angle"]
        - ["Lustre", "Surface reflectance quality of outermost nacre", "Yes", "Sharpness of reflected image; independent of orient"]
        - ["Fluorescence", "UV-induced emission (organic matrix + Mn²⁺)", "Yes", "Visible only under UV lamp; inert under ordinary light"]
        - ["Coating iridescence (imitation)", "TiO₂ or fish-scale essence d'orient on glass/plastic bead", "Imitation only", "Tooth test (gritty = genuine nacre); X-ray shows no nacre layers; SG ~2.7 for genuine nacre vs ~2.4 for glass"]

  - title: Diagnostic Relevance
    content: |
      Orient in pearl identification and grading:
    subsections:
      - title: Quality Factor
        content: |
          Strong orient increases pearl value. It is assessed as one of several quality factors
          alongside lustre, surface, shape, colour, and size. The characteristic Tahitian peacock
          orient (green + reddish iridescence on dark body) is a premium quality indicator.

      - title: Nacre Thickness Indicator
        content: |
          Absence of orient in a cultured pearl may indicate very thin nacre or a coated
          imitation. Nacre thickness can be checked by observing the drill hole under magnification
          (concentric layers visible) or by X-ray fluorescence.

      - title: Imitation Detection
        content: |
          Imitation pearls coated with fish-scale essence d'orient (guanine platelets) or TiO₂
          can simulate orient superficially. However, they lack the nacre microstructure; the
          tooth test (genuine nacre feels gritty; imitation feels smooth), X-ray, and microscopic
          examination of the drill hole distinguish genuine nacre from coating.

