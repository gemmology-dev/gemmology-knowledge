title: Alexandrite Effect – Physical Mechanism
description: Deep dive into the alexandrite effect – Cr³⁺ in trigonal crystal field, the dual transmission window, photopic peak balance, named species including garnets, sapphire, and synthetic spinel, and how to test colour change under standardised illuminants.
order: 16
