title: Twin Laws in Gemmology
description: Named twin laws – spinel, Carlsbad, Manebach, Baveno, albite, pericline, Brazil, Dauphiné, Japan – and corundum parting, with diagnostic applications.
order: 1.6
category: fundamentals
difficulty: advanced
icon: gem
related:
  - fundamentals/crystal-systems
  - fundamentals/crystallography-advanced
  - fundamentals/physical-properties
tags:
  - twinning
