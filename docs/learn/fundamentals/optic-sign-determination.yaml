title: Optic Sign Determination
description: Determining positive or negative optic sign for uniaxial and biaxial gems using the refractometer, lambda plate, and interference figures.
order: 3.6
category: fundamentals
difficulty: advanced
icon: prism
related:
  - fundamentals/optical-properties
  - fundamentals/optical-properties-advanced
  - fundamentals/crystal-systems
  - equipment/polariscope
