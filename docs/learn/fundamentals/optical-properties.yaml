        - ["Beryl varieties", "1.56-1.60", "0.003-0.010", "U-"]
        - ["Calcite varieties", "1.48-1.66", "0.172", "U-"]
        - ["Chrysoberyl", "1.74-1.76", "0.008-0.010", "B+"]
        - ["Corundum varieties", "1.76-1.78", "0.008-0.009", "U-"]
