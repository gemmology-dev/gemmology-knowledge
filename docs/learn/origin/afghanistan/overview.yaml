  - title: Mining Under Conflict
    callout:
      type: warning
      title: Four Decades of Disruption
      text: |
        Afghan gem mining has been severely disrupted by successive conflicts: the Soviet
        invasion (1979), civil war (1992–1996), Taliban era (1996–2001), and post-2001
        insurgency. Artisanal mining continued throughout under the control of various
        armed groups.

        The gem sector has been a priority for development efforts, but progress is
        fragmented. International gem laboratories increasingly receive Afghan-origin
        material for origin certification, requiring careful chain-of-custody documentation.

  - title: Nuristan — Kunzite and Pegmatite Gems
    content: |
      Nuristan Province and adjacent Kunar Province host one of the world's finest
      sources of gem kunzite (pink-lilac spodumene, LiAlSi₂O₆, Mn-coloured) in
      LCT-type granitic pegmatites. Additional pegmatite gems include:

      - Green tourmaline (elbaite)
      - Aquamarine (blue-green beryl)
      - Rubellite (red tourmaline)
      - Hiddenite (green spodumene — rare)

      Afghan kunzite crystals are among the largest and most saturated in the trade.
      No dedicated origin-determination paper for Nuristan kunzite specifically was
      retrieved; this material is identified by physical properties and geological provenance.

  - title: Jagdalak Ruby — Citation Note
    callout:
      type: warning
      title: CITATION NEEDED
      text: |
        Jagdalak (Kabul Province) is noted in geological literature as a marble-hosted
        ruby locality related to the Hunza/Mogok marble-ruby belt. However, no dedicated
        peer-reviewed gemmological characterisation paper for Jagdalak ruby was retrieved.
        The marble-hosted chemistry is inferred from the general Asian marble ruby group
        literature (Giuliani et al. 2015).

        This locality is not described in detail here pending dedicated literature.
        Builders and FGA candidates should note that Jagdalak ruby origin determination
        would rely on the general marble-hosted ruby criteria (low Fe, strong fluorescence,
        carbonate inclusions) rather than locality-specific diagnostics.

