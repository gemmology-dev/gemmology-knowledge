title: Panjshir Emerald – Afghanistan
description: Hydrothermal-sediment hosted Panjshir emerald; high Fe UV-Vis bands, low Li, three-phase inclusions in black shale context; distinction from Colombian.
order: 3
category: origin
subcategory: afghanistan
difficulty: advanced
icon: gem
