title: "Lapis Lazuli: Sar-e-Sang, Afghanistan"
description: "Sar-e-Sang (Badakhshan) lapis lazuli: the canonical ancient-world source, >7,000 years of continuous mining, geochemical fingerprinting, grades and quality."
