title: India – Alexandrite, Diamond (Panna), and Garnet
description: Indian gem deposits – Andhra Pradesh alexandrite and chrysoberyl, Panna kimberlite diamond, Orissa garnet; geological context; Koh-i-Noor attribution qualified.
