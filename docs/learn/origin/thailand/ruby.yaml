title: Thai Ruby – Chanthaburi-Trat and Bo Rai Types
description: Basaltic-hosted Siam ruby from Chanthaburi-Trat and Bo Rai; diagnostic high-Fe chemistry, 451/460/470 nm iron triplet, weak fluorescence, alluvial habit.
