title: Thai Blue Zircon – Heat-Treatment Hub
description: Thailand as the global centre for heat-treating Cambodian and Vietnamese zircon rough into blue zircon; origin, treatment process, and identification.
order: 4
category: origin
subcategory: thailand
difficulty: intermediate
