title: Thai Sapphire – Bo Phloi and Kanchanaburi Types
description: Basaltic high-Fe blue sapphire from Bo Phloi and Kanchanaburi; strong 450/460/470 nm iron triplet, common heat treatment, basalt-suite inclusions.
