title: Katlang Pink Topaz — Pakistan
description: Chromium-coloured pink to champagne topaz from Katlang, Mardan district; Cr³⁺ colouring diagnostic, calcite-vein hosted, rare among topaz globally.
order: 4
category: origin
subcategory: pakistan
difficulty: advanced
icon: gem
