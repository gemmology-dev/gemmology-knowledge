sections:
  - title: Introduction
    content: |
      The Swat Valley (Mingora area) of Khyber Pakhtunkhwa Province hosts one of the
      world's notable emerald deposits, distinguished by a unique geological setting:
      chromium from ophiolitic chromite in the Indus suture zone produced Cr-rich
      hydrothermal emerald in talc-carbonate fracture systems of serpentinised peridotite.
      This ophiolite-hosted type is distinct from the Colombian black-shale model and from
      schist-belt types (Zambia, Zimbabwe). Swat material is characterised by small stones
      with high colour saturation; estimated reserves of ~70 million carats are mostly
      small crystal size.

      Guo et al. (2020) provided the first systematic documentation of Swat emerald
      inclusions: three-phase fluid inclusions (liquid + gas + solid) consistent with
      the high-salinity ophiolitic hydrothermal system, and chromian muscovite (chrome
      mica) — tabular brownish-green platelets very diagnostic for ophiolite-belt genesis
      and rare in emeralds from other deposit types. Additional inclusions include
      actinolite needles and talc. Li content is <200 ppmw (shared with Colombian and
      Afghan material), while the Cr-dominant chromophore and UV-Vis spectral profile
      assist in separation from other low-Li origins. {cite:guo-2020-swat-emerald}{cite:arif-moon-2007-muscovite}

  - title: Geological Setting
    content: |
      Swat Valley emerald genesis:
    subsections:
      - title: Host Rock — Ophiolite Belt
        content: |
          - Hosted in carbonatised ultramafic rocks (ophiolite belt) of the Indus suture
            zone, in the Mingora area of Swat Valley
          - The Indus suture zone represents the ancient tectonic collision boundary
            between the Indian and Eurasian plates; ophiolitic peridotite and chromite
            are the Cr source
          - Emerald-forming hydrothermal fluids penetrated fracture systems in the
            talc-carbonate host rock derived from serpentinised ultramafic protolith

      - title: Chromium Source
        content: |
          - Chromium is sourced from ophiolitic chromite through hydrothermal fluid
            interaction with the peridotite/serpentinite country rock
          - Arif and Moon (2007) documented chromian muscovite and tourmaline in
            emerald-bearing quartz veins: the muscovite shows "high Mg/Fe ratios (4–9)
            and variable Ni" — geochemical evidence linking Cr directly to the ophiolitic
            ultramafic host {cite:arif-moon-2007-muscovite}

  - title: Properties and Appearance
    content: |
      Characteristic features of Swat emerald:

      - **Colour**: Medium to deep green; highly saturated
      - **Size**: Typically small (<2 ct clean); "small stones with saturated color"
        is the standard trade descriptor; reserves estimated at ~70 million carats but
        mostly small crystal size
      - **Chromophore**: Cr³⁺ dominant; Cr/V ratio distinguishes ophiolite-hosted (Cr
        dominant) from other deposit types
      - **Fluorescence**: Strong red LWUV fluorescence driven by high Cr³⁺
      - **Chelsea Colour Filter**: Strong red (Cr dominant)

  - title: Diagnostic Inclusions
    content: |
      Guo et al. (2020) documented the inclusions of Swat emerald:
    subsections:
      - title: Fluid Inclusions
        content: |
          - **Three-phase fluid inclusions**: Liquid + gas + solid phases — documented
            for the first time in Swat emeralds by Guo et al. (2020); diagnostic for
            the high-salinity, high-temperature ophiolitic hydrothermal system {cite:guo-2020-swat-emerald}

      - title: Mineral Inclusions
        content: |
          - **Chromian muscovite (chrome mica)**: Tabular brownish-green platelets;
            very diagnostic for the ophiolite-belt genesis; rare in emeralds from
            other deposit types
          - **Actinolite needles**: Green amphibole; consistent with ultramafic host
          - **Biotite platelets**: Brown tabular mica
          - **Talc**: From the talc-carbonate host rock; soft and platy

  - title: Trace Element Chemistry
    content: |
      Chemical fingerprinting for origin determination:
    subsections:
      - title: Shared Low-Li Signature
        content: |
          - **Li < 200 ppmw** (lithium content): Shared with Colombian and Afghan emerald;
            distinguishes from high-Li Zambian, Zimbabwe, and Ethiopian material {cite:saeseaw-2019-emerald-origin}
          - The low-Li signature reflects a sediment/ophiolite geological heritage
            rather than granitic pegmatite host

      - title: Separation from Other Low-Li Origins
        content: |
          - **Cr/V ratio**: Swat is Cr-dominant (ophiolite-Cr source); Colombian Chivor
            is more V-dominant; Panjshir (Afghanistan) also Cr-dominant but with higher
            Fe and distinct fluid inclusions
          - **Other elements**: Sc, Mn, Co, Ni, Zn, Ga provide additional discrimination
            in multivariate trace element analysis
          - **UV-Vis**: Afghan Panjshir has "pronounced iron-related bands" not typical
            of Colombian; Swat has its own spectral profile

  - title: Deposit Type Classification
    callout:
      type: info
      title: Talc-Carbonate (Ophiolite-Belt) Type
      text: |
        Swat Valley emerald belongs to the "talc-carbonate" or "ophiolite-hosted" deposit
        type — distinct from:

        - SCHIST-BELT type (Zambia, Zimbabwe, Russia, Ethiopia): schist host at
          granite-ultramafic contact
        - BLACK-SHALE type (Colombia): hydrothermal in sedimentary host with no igneous
          proximity
        - PEGMATITIC type (Brazil Carnaíba, parts of Brazil): emerald in pegmatites

        The ophiolite-belt context makes Swat inclusion suite (chromian muscovite, actinolite,
        three-phase inclusions) unique among the major emerald sources.

