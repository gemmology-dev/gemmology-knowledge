title: Swat Valley Emerald — Pakistan
description: Ophiolite-hosted Cr-rich emerald from Mingora, Swat Valley; three-phase fluid inclusions, chromian muscovite, low Li chemistry, talc-carbonate paragenesis.
order: 2
category: origin
subcategory: pakistan
difficulty: advanced
icon: gem
