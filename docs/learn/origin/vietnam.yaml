title: Vietnam – Luc Yen Ruby and Cobalt-Blue Spinel
description: Marble-hosted ruby and spinel from Luc Yen (Yen Bai) and Quy Chau; low-Fe high-Cr chemistry, cobalt-blue spinel, distinction from Burmese material.
