title: Ethiopia – Wollo Opal and Shakiso Emerald
description: Wollo (Welo) hydrophane opal (volcanic host, water-absorbing, distinct from Australian); Shakiso mica-schist emerald; Tigray sapphire [CITATION NEEDED].
