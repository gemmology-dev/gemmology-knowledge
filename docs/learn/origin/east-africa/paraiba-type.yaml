title: Paraiba-Type Tourmaline
description: Mozambican copper-bearing tourmaline with neon blue-green colours - discovery, characteristics, and the origin terminology debate.
order: 6
category: origin
subcategory: east-africa
difficulty: advanced
icon: gem
