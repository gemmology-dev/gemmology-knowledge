title: Colombian Emerald Mines — Sub-Distinctions
description: Mine-level diagnostics for Muzo (parisite + halite), Chivor (pyrite dominant), Coscuez, La Pita, and trapiche emerald; cross-reference to colombia.yaml.
order: 6
category: origin
difficulty: advanced
icon: gem
