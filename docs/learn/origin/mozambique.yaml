title: Mozambique — Montepuez Ruby and Paraíba Tourmaline
description: Montepuez ruby (Cabo Delgado) — two-type amphibolite-hosted and alluvial; Mavuco Paraíba-type Cu-bearing tourmaline; LA-ICP-MS origin discrimination.
