title: Zimbabwe — Sandawana Emerald and Marange Diamond
description: Sandawana (Belingwe) emerald — vivid Cr-rich, tremolite inclusions, very small; Marange alluvial diamond; Murehwa chrysoberyl [CITATION NEEDED].
