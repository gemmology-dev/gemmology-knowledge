title: Montana Sapphire — Yogo Gulch, Rock Creek, Missouri River
description: Yogo Gulch steely-blue lamprophyre sapphire (no heat needed), Rock Creek and Missouri River alluvial pastels; distinct Fe/Ti/Mg trace element chemistry; US commercial significance.
order: 2
