sections:
  - title: Introduction
    content: |
      Australia is a world-leading gem producer whose output spans three unrelated
      geological environments: Cretaceous sedimentary basins in the arid interior
      (opal), Cenozoic basalt fields in New South Wales and Queensland (sapphire), and
      the Proterozoic lamproite pipe of the East Kimberley (Argyle diamonds, now closed).
      {cite:schumann-2009-gemstones} Australian opal accounts for approximately 95% of
      world production.

      Diagnostic significance varies sharply by gem type. Black opal from Lightning Ridge
      is defined by its N1–N4 body tone and the play-of-colour that the dark background
      intensifies; boulder opal carries its ironstone matrix as an inherent identity
      marker. Australian sapphires carry a high-iron, low-chromium geochemical fingerprint
      from their basaltic host, producing characteristically dark blues and the
      parti-colour zoning unique to this origin.

      The Argyle mine's closure in November 2020 removed the dominant supply of pink
      diamonds from the world market. Argyle certification now anchors provenance
      premium for pink, violet, champagne, and red Argyle-origin material, making
      documentation an indispensable element of any transaction. {cite:schumann-2009-gemstones}

  - title: Major Gem Types
    content: |
      Australia's primary gem production:
    subsections:
      - title: Opal
        content: |
          - **Black opal**: Lightning Ridge, NSW (most valuable)
          - **White opal**: Coober Pedy, SA (major production)
          - **Boulder opal**: Queensland (ironstone matrix)
          - **Crystal opal**: Various locations
          - **Market share**: ~95% of world opal production

      - title: Sapphire
        content: |
          - **New South Wales**: Inverell, Glen Innes
          - **Queensland**: Anakie, Rubyvale
          - **Character**: Often darker; parti-sapphires notable
          - **Volume**: Major commercial production

      - title: Other Gems
        content: |
          - **Chrysoprase**: Marlborough, Queensland (finest worldwide) {cite:schumann-2009-gemstones}
          - **Zircon**: Various colours, good quality
          - **Diamonds**: Argyle mine (closed 2020) - historic pink source {cite:schumann-2009-gemstones}

  - title: Australian Gem Trade
    content: |
      Market characteristics:

      - **Opal dominance**: Australia defines the world opal market
      - **Sapphire commercial**: Major volume producer
      - **Niche specialties**: Parti-sapphire, chrysoprase, boulder opal
      - **Ethical sourcing**: Generally good labour standards
      - **Origin documentation**: Certificates available
      - **Treatment disclosure**: Good industry standards

  - title: Regional Distribution
    content: |
      Gems by Australian state:
    subsections:
      - title: New South Wales
        content: |
          - Lightning Ridge (black opal)
          - Inverell, Glen Innes (sapphire)
          - White Cliffs (white opal, historic)
          - Emmaville (emerald, limited)

      - title: South Australia
        content: |
          - Coober Pedy (white opal - largest opal field)
          - Andamooka (matrix opal)
          - Mintabie (opal)

      - title: Queensland
        content: |
          - Boulder opal belt (Quilpie, Winton, Opalton)
          - Anakie, Rubyvale (sapphire)
          - Marlborough (chrysoprase)

      - title: Western Australia
        content: |
          - Argyle (diamonds - closed 2020)
          - Prehnite deposits
          - Limited gemstone production

