title: Russian Demantoid Garnet – Ural Mountains
description: Ural demantoid (andradite, Cr-coloured); horsetail inclusions – byssolite terminology and Kissin 2021 mineralogical correction; LA-ICP-MS origin discrimination from Namibia and Madagascar.
order: 2
