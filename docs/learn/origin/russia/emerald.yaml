title: Ural Emerald — Malyshevsky, Russia
description: Ural emerald from the Malyshevsky/Izumrudnye Kopi deposit; phlogopite mica inclusions diagnostic; Cr+V chromophores; mica-schist contact zone genesis.
order: 4
