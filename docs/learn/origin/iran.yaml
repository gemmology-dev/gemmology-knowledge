title: Iran – Nishapur (Neyshabur) Turquoise
description: Persian turquoise from Neyshabur, Khorasan – the global colour standard; volcanic tuff host, spider-web matrix, Cu-Al phosphate, treatment assessment.
order: 14
category: origin
difficulty: intermediate
icon: gem
