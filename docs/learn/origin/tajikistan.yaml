title: Tajikistan – Kuh-i-Lal Spinel (Balas Ruby)
description: Kuh-i-Lal Gorno-Badakhshan red and pink spinel – historic "Balas ruby" of the Persian courts; Cr-coloured marble-hosted; trace element distinction from Mogok and Luc Yen.
order: 12
category: origin
difficulty: advanced
