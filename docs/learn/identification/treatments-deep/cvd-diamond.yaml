      rows:
        - ["SiV⁻ doublet at 736.9/736.6 nm (PL)", "Silicon-vacancy centre from Si contamination in growth chamber; seen in PL at 77 K {cite:eaton-magana-2017}", "Growth artifact — trace Si in plasma"]
