title: CVD Diamond Detection — Deep Diagnostic Reference
description: Full detection protocol for CVD synthetic diamonds, distinguishing from natural and HPHT-treated stones using DiamondView, FTIR, and photoluminescence.
order: 4
category: identification
difficulty: advanced
icon: diamond
