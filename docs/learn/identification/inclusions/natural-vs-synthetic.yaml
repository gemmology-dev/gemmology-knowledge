title: Natural vs Synthetic Indicators
description: Distinguishing natural gemstones from synthetics using inclusion evidence.
order: 7
category: identification
subcategory: inclusions
difficulty: intermediate
icon: search
related:
  - identification/inclusions/overview
  - identification/synthetics
  - identification/inclusions/solid-inclusions
  - identification/inclusions/fluid-inclusions
tags:
  - microscopy
