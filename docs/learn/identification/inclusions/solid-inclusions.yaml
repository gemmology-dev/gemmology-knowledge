title: Solid Inclusions
description: Crystal inclusions - identifying mineral guests trapped within gemstones during formation.
order: 2
category: identification
subcategory: inclusions
difficulty: intermediate
icon: search
related:
  - identification/inclusions/overview
  - identification/inclusions/natural-vs-synthetic
  - species/corundum
  - species/emerald
tags:
  - microscopy
